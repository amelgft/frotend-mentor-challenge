<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->

  <style>

    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    body{
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      background-color: hsl(0, 0%, 8%);
    }

    .container{
      display: flex;
      flex-direction: column;
      height: 87vh;
      align-items: center;
      justify-content: center;
      background-color: hsl(0, 0%, 20%); 
      
      width: 400px;
      border-radius: 10px;
      margin: 0 auto;
      
    }

    img{
      border-radius: 50%;
    }
    .person-name h1{
      font-weight: 500;
      color: hsl(0, 0%, 100%);
      margin-bottom: 0;
      
    }
    .place p{
      color:  hsl(75, 94%, 57%);
      
    }
    .speciality{
      font-weight: 200;
      color: hsl(0, 0%, 100%);
    }

    .social-accounts {
      color: hsl(0, 0%, 100%);
      background-color: hsl(0, 0%, 12%);
      font-weight: 600;
      width: 200px;
      text-align: center;
      padding: 10px;
      font-size: 10px;
      border-radius: 5px;
      margin: 5px;
      transition: 0.2s;
    }
    .social-accounts:hover{
      background-color: hsl(75, 94%, 57%);
      color: black;
    }
    .attribution{
      font-weight: 600;
      color: hsl(0, 0%, 100%);
      padding: 10px;
    }
    @media (max-width:375px){
      .container{
        height: 93vh;
        width: 300px;
      }
      img{
        width: 130px;
      }
    }

  </style>
  
</head>
<body>
<div class="container">
  <div class="img-profile">
    <img src="assets/images/avatar-jessica.jpeg" alt="jessica personal image">
  </div>
  <div class="person-name">
    <h1> Jessica Randall</h1>
  </div>
  <div class="place">
    <p>London, United Kingdom</p>
  </div>
  <div class="speciality">
    <p>"Front-end developer and avid reader."</p>
  </div>
  
    <p class="social-accounts">GitHub</p>
    <p class="social-accounts">Frontend Mentor</p>
    <p class="social-accounts">LinkedIn</p>
    <p class="social-accounts">Twitter</p>
    <p class="social-accounts">Instagram</p>
  </div>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Amel </a>.
  </div>
</body>
</html>
